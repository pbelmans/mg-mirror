name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.161.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}" hugo
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - uses: actions/configure-pages@v6
      - name: Build
        run: make build
      - name: Verify
        run: |
          make check
          node scripts/check_search.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .cache/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
